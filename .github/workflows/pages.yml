# Đưa bản build lên GitHub Pages để thử trên điện thoại và máy tính thật (docs/thu-that/README.md).
# Service worker (APP-10) chỉ chạy trên HTTPS hoặc localhost, nên cần một địa chỉ HTTPS như GitHub Pages.
# Chỉ chạy sau khi CI trên main đạt, để không đưa lên bản đang lỗi. Chạy tay được ở tab Actions.
# Bật một lần (chủ repo): Settings > Pages > Build and deployment, Source là "GitHub Actions"; rồi Settings > Secrets and
# variables > Actions > Variables, thêm PAGES_ENABLED = true. Chưa có biến này thì workflow bỏ qua, không báo lỗi.
# Lưu ý: bật Pages là đưa app và bộ dữ liệu của khách lên một địa chỉ web công khai.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Địa chỉ trang học chính cho nút "Quay lại trang học" (APP-12). Để trống thì dùng trang chủ mặc định.
          VITE_HOST_URL: ${{ vars.VITE_HOST_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
