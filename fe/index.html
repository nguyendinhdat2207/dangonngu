<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VITASR Đa ngôn ngữ</title>
    <!-- @spec FND-03: áp dụng giao diện đã lưu trước khung hình đầu tiên, tránh nhấp nháy. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('vitasr2.settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
